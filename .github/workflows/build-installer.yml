# Build BassesModManager in Release and create Inno Setup installer.
# Run manually: Actions → "Build BassesModManager installer" → Run workflow (set version).
# The workflow updates AssemblyInfo and version labels in MainWindow.xaml + GameSelectionWindow.xaml to the given version 
# then builds and runs Inno Setup. Installer is uploaded as artifact.
name: Build BassesModManager installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2)'
        required: true
        default: '1.2'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from input
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Update AssemblyInfo.cs and set four-part version
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERSION)) { $env:VERSION = '1.2'; echo 'VERSION=1.2' >> $env:GITHUB_ENV }
          $parts = $env:VERSION -split '\.'
          $assemblyVersion = ($parts + ('0', '0', '0', '0'))[0..3] -join '.'
          echo "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV
          $path = "BassesModManager\Properties\AssemblyInfo.cs"
          (Get-Content $path) -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")" -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")" | Set-Content $path
        shell: pwsh

      - name: Update version text in MainWindow.xaml and GameSelectionWindow.xaml
        run: |
          $versionText = "v$env:VERSION"
          foreach ($path in @("BassesModManager\MainWindow.xaml", "BassesModManager\GameSelectionWindow.xaml")) {
            (Get-Content $path -Raw) -replace 'Text="v[^"]*"', "Text=`"$versionText`"" | Set-Content $path -NoNewline
          }
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          msbuild BassesModManager\BassesModManager.sln -t:Restore -p:Configuration=Release -p:Platform="Any CPU" -v:minimal

      - name: Build solution (Release)
        run: |
          msbuild BassesModManager\BassesModManager.sln -p:Configuration=Release -p:Platform="Any CPU" -v:minimal
        shell: pwsh

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "BassesModManager\installer.iss"
        shell: pwsh

      # The in-app auto-updater (UpdateService) refuses to run an installer it can't
      # verify, so every release MUST include this .sha256 next to the exe.
      # Upload BOTH files as assets when creating the GitHub Release.
      - name: Generate SHA-256 checksum
        run: |
          $exe = Get-Item "Output/BassesModManager_Setup_*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($exe.FullName).sha256" -Value "$hash  $($exe.Name)" -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassesModManager-Setup-${{ env.VERSION }}
          path: |
            Output/BassesModManager_Setup_*.exe
            Output/BassesModManager_Setup_*.exe.sha256
